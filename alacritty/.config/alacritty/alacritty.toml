# ~/.config/alacritty/alacritty.toml

[env]
TERM="xterm-256color"

[window]
opacity = 0.98
padding = { x = 10, y = 10 }
decorations = "full"
# startup_mode = "Windowed"

[font]
size = 12.0

[cursor]
style = { shape = "Beam", blinking = "On" }
blink_interval = 500

[colors.primary]
background = "#282828"
foreground = "#ebdbb2"

[colors.normal]
black   = "#282828"
red     = "#cc241d"
green   = "#98971a"
yellow  = "#d79921"
blue    = "#458588"
magenta = "#b16286"
cyan    = "#689d6a"
white   = "#a89984"

[colors.bright]
black   = "#928374"
red     = "#fb4934"
green   = "#b8bb26"
yellow  = "#fabd2f"
blue    = "#83a598"
magenta = "#d3869b"
cyan    = "#8ec07c"
white   = "#ebdbb2"

[selection]
save_to_clipboard = true

[scrolling]
history = 10000
multiplier = 3

[mouse]
hide_when_typing = true
